# Nginx configuration for Duel Dome WebSocket server
# Place this file in /etc/nginx/sites-available/duel-dome
# Then create symlink: sudo ln -s /etc/nginx/sites-available/duel-dome /etc/nginx/sites-enabled/

# Update YOUR_DOMAIN to your actual domain (e.g., api.dueldome.com)
# Update /opt/duel-dome to your actual installation path

upstream duel_dome_backend {
    server 127.0.0.1:3000;  # FastAPI runs on port 3000
    keepalive 64;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server with WebSocket support
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL certificate paths (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    
    # SSL configuration for security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/nginx/duel-dome-access.log;
    error_log /var/log/nginx/duel-dome-error.log;

    # WebSocket endpoint - CRITICAL for game connection
    location /ws {
        proxy_pass http://duel_dome_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts (important for long-lived connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # Buffer settings for real-time communication
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://duel_dome_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Root endpoint (optional - for testing)
    location / {
        proxy_pass http://duel_dome_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: serve static files if needed (not required with Vercel frontend)
    # location / {
    #     proxy_pass http://duel_dome_backend;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

