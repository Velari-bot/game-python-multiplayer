# Nginx configuration for Duel Dome - HTTP ONLY (for IP-based deployment)
# Use this when deploying with IP address instead of domain
# Place this file in /etc/nginx/sites-available/duel-dome
# Then create symlink: sudo ln -s /etc/nginx/sites-available/duel-dome /etc/nginx/sites-enabled/

# Update YOUR_IP to your actual IP (e.g., 45.77.145.57)

upstream duel_dome_backend {
    server 127.0.0.1:3000;  # FastAPI runs on port 3000
    keepalive 64;
}

# HTTP server - NO SSL
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_IP;

    # Logging
    access_log /var/log/nginx/duel-dome-access.log;
    error_log /var/log/nginx/duel-dome-error.log;

    # WebSocket endpoint - CRITICAL for game connection
    # NOTE: This uses ws:// not wss:// since no SSL
    location /ws {
        proxy_pass http://duel_dome_backend;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts (important for long-lived connections)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # Buffer settings for real-time communication
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://duel_dome_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Root endpoint (for testing)
    location / {
        proxy_pass http://duel_dome_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

